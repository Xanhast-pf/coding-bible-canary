name: Coding Bible conformance lab

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      coding_bible_ref:
        description: Coding Bible branch, tag, or SHA to test as the candidate
        required: false
        default: main
  repository_dispatch:
    types: [coding-bible-candidate]

permissions:
  contents: read

env:
  CODING_BIBLE_ROOT: .coding-bible-under-test
  CANDIDATE_REF: ${{ github.event.client_payload.ref || inputs.coding_bible_ref || 'main' }}

jobs:
  candidate-conformance:
    name: Candidate · catalog/library/CLI/browser/config/perf
    runs-on: ubuntu-latest
    steps:
      - name: Checkout canary
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Checkout Coding Bible candidate
        uses: actions/checkout@v7
        with:
          repository: Xanhast-pf/coding-bible
          ref: ${{ env.CANDIDATE_REF }}
          path: .coding-bible-under-test
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10.15.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .coding-bible-under-test/.nvmrc

      - name: Install candidate dependencies
        working-directory: .coding-bible-under-test
        run: pnpm install --frozen-lockfile

      - name: Self-test the canary harness
        run: node --test scripts/test/*.test.mjs

      - name: Verify 128-rule catalog contract
        run: node scripts/verify-catalog.mjs

      - name: Verify canonical detector contracts
        run: node scripts/run-canonical-conformance.mjs

      - name: Run independent adversarial negatives
        run: node scripts/run-adversarial-conformance.mjs

      - name: Verify CLI consumer contract
        run: node scripts/run-cli-conformance.mjs

      - name: Verify browser consumer contract
        run: node scripts/run-browser-parity.mjs

      - name: Torture configuration and custom-rule boundaries
        run: node scripts/run-config-matrix.mjs

      - name: Performance regression guard
        env:
          CANARY_PERF_FILES: 1000
          CANARY_PERF_MAX_MS: 30000
        run: node scripts/run-performance.mjs

      - name: Render conformance summary
        if: always()
        run: node scripts/render-report.mjs

      - name: Upload candidate conformance artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coding-bible-candidate-conformance
          path: artifacts/
          if-no-files-found: warn

  candidate-action:
    name: Candidate · external GitHub Action contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout canary
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Checkout Coding Bible candidate
        uses: actions/checkout@v7
        with:
          repository: Xanhast-pf/coding-bible
          ref: ${{ env.CANDIDATE_REF }}
          path: .coding-bible-under-test
          persist-credentials: false

      - name: Candidate known-bad fixture must be rejected
        id: bad
        continue-on-error: true
        uses: ./.coding-bible-under-test
        with:
          scope: project
          path: fixtures/bad
          fail-on: error
          sarif: true

      - name: Assert candidate rejection and SARIF contract
        env:
          OUTCOME: ${{ steps.bad.outcome }}
          CONCLUSION: ${{ steps.bad.outputs.conclusion }}
          FINDINGS: ${{ steps.bad.outputs.findings }}
          ERRORS: ${{ steps.bad.outputs.errors }}
          WARNINGS: ${{ steps.bad.outputs.warnings }}
          DIAGNOSTICS: ${{ steps.bad.outputs.diagnostics }}
          RULES_CHECKED: ${{ steps.bad.outputs.rules-checked }}
          SARIF_PATH: ${{ steps.bad.outputs.sarif-path }}
        run: node scripts/assert-action-output.mjs bad

      - name: Candidate known-clean fixture must pass
        id: good
        uses: ./.coding-bible-under-test
        with:
          scope: project
          path: fixtures/good
          fail-on: error

      - name: Assert candidate clean contract
        env:
          OUTCOME: ${{ steps.good.outcome }}
          CONCLUSION: ${{ steps.good.outputs.conclusion }}
          FINDINGS: ${{ steps.good.outputs.findings }}
          ERRORS: ${{ steps.good.outputs.errors }}
          WARNINGS: ${{ steps.good.outputs.warnings }}
          DIAGNOSTICS: ${{ steps.good.outputs.diagnostics }}
          RULES_CHECKED: ${{ steps.good.outputs.rules-checked }}
        run: node scripts/assert-action-output.mjs good

      - name: Candidate custom rulebook must participate in Action analysis
        id: custom
        uses: ./.coding-bible-under-test
        with:
          scope: project
          path: fixtures/custom
          config: fixtures/custom/coding-bible.config.json
          fail-on: error

      - name: Assert custom rulebook Action contract
        shell: bash
        env:
          OUTCOME: ${{ steps.custom.outcome }}
          CONCLUSION: ${{ steps.custom.outputs.conclusion }}
          FINDINGS: ${{ steps.custom.outputs.findings }}
          WARNINGS: ${{ steps.custom.outputs.warnings }}
          ERRORS: ${{ steps.custom.outputs.errors }}
          DIAGNOSTICS: ${{ steps.custom.outputs.diagnostics }}
          RULES_CHECKED: ${{ steps.custom.outputs.rules-checked }}
        run: |
          set -euo pipefail
          test "$OUTCOME" = "success"
          test "$CONCLUSION" = "passed"
          test "$FINDINGS" -eq 1
          test "$WARNINGS" -eq 1
          test "$ERRORS" -eq 0
          test "$DIAGNOSTICS" -eq 0
          test "$RULES_CHECKED" -eq 24

  released-action:
    name: Published Action · v0.27.0 immutable contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout canary
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Published known-bad fixture must be rejected
        id: bad
        continue-on-error: true
        uses: Xanhast-pf/coding-bible@v0.27.0
        with:
          scope: project
          path: fixtures/bad
          fail-on: error
          sarif: true

      - name: Assert published rejection and SARIF contract
        env:
          OUTCOME: ${{ steps.bad.outcome }}
          CONCLUSION: ${{ steps.bad.outputs.conclusion }}
          FINDINGS: ${{ steps.bad.outputs.findings }}
          ERRORS: ${{ steps.bad.outputs.errors }}
          WARNINGS: ${{ steps.bad.outputs.warnings }}
          DIAGNOSTICS: ${{ steps.bad.outputs.diagnostics }}
          RULES_CHECKED: ${{ steps.bad.outputs.rules-checked }}
          SARIF_PATH: ${{ steps.bad.outputs.sarif-path }}
        run: node scripts/assert-action-output.mjs bad

      - name: Published known-clean fixture must pass
        id: good
        uses: Xanhast-pf/coding-bible@v0.27.0
        with:
          scope: project
          path: fixtures/good
          fail-on: error

      - name: Assert published clean contract
        env:
          OUTCOME: ${{ steps.good.outcome }}
          CONCLUSION: ${{ steps.good.outputs.conclusion }}
          FINDINGS: ${{ steps.good.outputs.findings }}
          ERRORS: ${{ steps.good.outputs.errors }}
          WARNINGS: ${{ steps.good.outputs.warnings }}
          DIAGNOSTICS: ${{ steps.good.outputs.diagnostics }}
          RULES_CHECKED: ${{ steps.good.outputs.rules-checked }}
        run: node scripts/assert-action-output.mjs good

  changed-lines-contract:
    name: Changed-line contract · candidate + v0.27.0
    runs-on: ubuntu-latest
    steps:
      - name: Checkout canary
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Checkout Coding Bible candidate
        uses: actions/checkout@v7
        with:
          repository: Xanhast-pf/coding-bible
          ref: ${{ env.CANDIDATE_REF }}
          path: .coding-bible-under-test
          persist-credentials: false

      - name: Create one unpushed violation
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          base_sha="$(git rev-parse HEAD)"
          git config user.name "coding-bible-canary"
          git config user.email "coding-bible-canary@users.noreply.github.com"
          cat >> fixtures/changed/probe.ts <<'EOF_INNER'

          // New violation: changed-scope must report this line and only this TS-001.
          export const introduced: any = "new debt";
          EOF_INNER
          git add fixtures/changed/probe.ts
          git commit -m "canary: introduce one new violation"
          echo "base_sha=$base_sha" >> "$GITHUB_OUTPUT"

      - name: Candidate changed-scope must reject only new debt
        id: candidate
        continue-on-error: true
        uses: ./.coding-bible-under-test
        with:
          scope: changed
          path: fixtures/changed
          base-ref: ${{ steps.commit.outputs.base_sha }}
          fail-on: error
          sarif: true

      - name: Preserve candidate changed-scope SARIF
        shell: bash
        env:
          SARIF_PATH: ${{ steps.candidate.outputs.sarif-path }}
        run: |
          set -euo pipefail
          test -n "$SARIF_PATH"
          mkdir -p artifacts/action
          cp "$SARIF_PATH" artifacts/action/candidate-changed.sarif

      - name: Published changed-scope must reject only new debt
        id: published
        continue-on-error: true
        uses: Xanhast-pf/coding-bible@v0.27.0
        with:
          scope: changed
          path: fixtures/changed
          base-ref: ${{ steps.commit.outputs.base_sha }}
          fail-on: error
          sarif: true

      - name: Assert both changed-line consumers
        shell: bash
        env:
          CANDIDATE_OUTCOME: ${{ steps.candidate.outcome }}
          CANDIDATE_FINDINGS: ${{ steps.candidate.outputs.findings }}
          CANDIDATE_ERRORS: ${{ steps.candidate.outputs.errors }}
          CANDIDATE_DIAGNOSTICS: ${{ steps.candidate.outputs.diagnostics }}
          CANDIDATE_RULES: ${{ steps.candidate.outputs.rules-checked }}
          CANDIDATE_SARIF: artifacts/action/candidate-changed.sarif
          RELEASE_OUTCOME: ${{ steps.published.outcome }}
          RELEASE_FINDINGS: ${{ steps.published.outputs.findings }}
          RELEASE_ERRORS: ${{ steps.published.outputs.errors }}
          RELEASE_DIAGNOSTICS: ${{ steps.published.outputs.diagnostics }}
          RELEASE_RULES: ${{ steps.published.outputs.rules-checked }}
          RELEASE_SARIF: ${{ steps.published.outputs.sarif-path }}
        run: |
          set -euo pipefail
          printf '%s\n' \
            "candidate: outcome=$CANDIDATE_OUTCOME findings=$CANDIDATE_FINDINGS errors=$CANDIDATE_ERRORS diagnostics=$CANDIDATE_DIAGNOSTICS rules=$CANDIDATE_RULES sarif=$CANDIDATE_SARIF" \
            "published: outcome=$RELEASE_OUTCOME findings=$RELEASE_FINDINGS errors=$RELEASE_ERRORS diagnostics=$RELEASE_DIAGNOSTICS rules=$RELEASE_RULES sarif=$RELEASE_SARIF"
          test "$CANDIDATE_OUTCOME" = "failure"
          test "$RELEASE_OUTCOME" = "failure"
          test "$CANDIDATE_FINDINGS" -eq 1
          test "$RELEASE_FINDINGS" -eq 1
          test "$CANDIDATE_ERRORS" -eq 1
          test "$RELEASE_ERRORS" -eq 1
          test "$CANDIDATE_DIAGNOSTICS" -eq 0
          test "$RELEASE_DIAGNOSTICS" -eq 0
          # The full Action contracts already enforce the exact 23-rule
          # denominator. This job is specifically a changed-scope filtering
          # contract, so avoid coupling it to a brittle per-language rule count.
          test "$CANDIDATE_RULES" -gt 0
          test "$RELEASE_RULES" -gt 0
          node - "$CANDIDATE_SARIF" "$RELEASE_SARIF" <<'NODE'
          const fs = require("node:fs");
          for (const file of process.argv.slice(2)) {
            const sarif = JSON.parse(fs.readFileSync(file, "utf8"));
            const results = sarif.runs?.[0]?.results ?? [];
            if (results.length !== 1 || results[0]?.ruleId !== "TS-001") process.exit(1);
          }
          NODE
